name: Import Skill to Catalog

on:
  workflow_dispatch:
    inputs:
      entry_url:
        description: 'URL to the remote skill-catalog-entry.json (from a GitHub Release)'
        required: true
        type: string
      skill_id:
        description: 'Optional: Skill ID (e.g. pdf_document) for the PR branch name'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    name: Import Skill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema==4.23.0

      - name: Verify import script exists
        run: |
          if [ ! -f "scripts/import_catalog_entry.py" ]; then
            echo "::error::scripts/import_catalog_entry.py not found"
            exit 1
          fi

      - name: Run import script
        run: |
          python scripts/import_catalog_entry.py \
            --url "${{ inputs.entry_url }}" \
            --catalog catalog.json

      - name: Validate catalog after import
        run: python scripts/validate.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: add-skill-${{ inputs.skill_id || github.run_id }}
          title: "feat(catalog): import skill from ${{ inputs.entry_url }}"
          commit-message: "feat(catalog): import new skill"
          body: |
            ## Automated Skill Import

            This PR was automatically generated by the `Import Skill to Catalog` workflow.

            **Source URL:**
            `${{ inputs.entry_url }}`

            ### Checklist
            - [ ] The skill details are correct
            - [ ] The SHA-256 checksum is valid
            - [ ] The skill package is accessible at the download URL

            ---
            *Auto-generated by GitHub Actions*
          delete-branch: true