# Automated workflow to import skills from external releases into the catalog.
#
# Triggered manually with the URL to a skill-catalog-entry.json file.
#
# Usage:
#   1. Go to Actions tab in GitHub
#   2. Select "Import Skill to Catalog"
#   3. Click "Run workflow"
#   4. Paste the URL to the skill-catalog-entry.json from a skill's release
#   5. Optionally specify the skill_id for cleaner branch naming
#
# The workflow will:
#   - Fetch the entry JSON from the provided URL
#   - Validate it against the schema
#   - Verify the SHA-256 checksum matches the actual package
#   - Merge it into catalog.json (update if exists, add if new)
#   - Create a Pull Request for review

name: Import Skill to Catalog

on:
  workflow_dispatch:
    inputs:
      entry_url:
        description: 'URL to the remote skill-catalog-entry.json (from a GitHub Release)'
        required: true
        type: string
      skill_id:
        description: 'Optional: Skill ID (e.g. pdf_document) for the PR branch name'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema==4.23.0

      - name: Run import script
        run: |
          python scripts/import_catalog_entry.py \
            --url "${{ inputs.entry_url }}" \
            --catalog catalog.json

      - name: Validate catalog after import
        run: python scripts/validate.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: add-skill-${{ inputs.skill_id || github.run_id }}
          title: "feat(catalog): import skill from ${{ inputs.entry_url }}"
          commit-message: "feat(catalog): import new skill"
          body: |
            This PR was automatically generated by the `Import Skill to Catalog` workflow.
            
            **Source URL:**
            `${{ inputs.entry_url }}`
            
            Please verify:
            - [ ] The skill details are correct.
            - [ ] The SHA-256 checksum is valid.
            - [ ] The skill package is accessible at the download URL.
            
            ---
            *Auto-merged by GitHub Actions*
          delete-branch: true